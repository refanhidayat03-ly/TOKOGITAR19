h1,h2,h3,.big,.stat b{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600}
button,input,select,textarea{font:inherit}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px}
.wrap.auth{max-width:400px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(120,60,80,.06)}
.btn{border:1px solid var(--ac);border-radius:10px;padding:10px 18px;background:var(--ac);color:var(--btx);cursor:pointer;font-weight:700;letter-spacing:.2px;transition:background .2s,transform .15s}
.btn:hover{background:var(--ac2);transform:translateY(-1px)}.btn:active{transform:none}
.btn.o{background:transparent;color:var(--ac)}.btn.o:hover{background:var(--pb)}
.btn.s{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--ac) 35%,transparent);border-color:var(--ac)}
.auth{margin:8vh auto}
.auth h1{margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--mu);margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.msg{min-height:22px;font-size:14px;margin-top:8px}.err{color:#c23b55}.ok{color:#2f8a5a}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:6px 0 16px;padding-right:56px}
.logo{margin:0;font-size:28px;color:var(--tx);display:flex;align-items:center;gap:10px;letter-spacing:.3px}
.auth .logo{justify-content:center}
.sk{width:24px;height:24px;flex:none}
.hi{color:var(--mu);font-size:15px}
.hero{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:16px;padding:28px;margin-bottom:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 14%,var(--card)),var(--card))}
.hero h1{margin:0;font-size:36px;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--mu)}
.sk-big{position:absolute;right:22px;top:50%;transform:translateY(-50%);opacity:.3}
.sk-big .sk{width:120px;height:120px}
.rowlbl{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;margin:20px 4px 8px;color:var(--ac2);display:flex;align-items:center;gap:12px}
.rowlbl::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-auto-flow:column;grid-auto-columns:250px;grid-template-rows:auto;gap:16px;overflow-x:auto;padding:14px;border:1px solid var(--bd);border-radius:16px;background:color-mix(in srgb,var(--card) 60%,transparent);scroll-snap-type:x proximity}
.grid>.g{scroll-snap-align:start}
.grid::-webkit-scrollbar{height:10px}.grid::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ac) 45%,transparent);border-radius:99px}
.g{padding:12px;transition:transform .2s,box-shadow .2s;animation:rise .5s both}
.g:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(120,60,80,.14)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.pic{position:relative;overflow:hidden;background:var(--pb);border-radius:10px;cursor:pointer}
.pic svg{width:100%;display:block}
.g b{display:block;margin-top:6px;line-height:1.3}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.price{font-weight:700;color:var(--ac);font-size:18px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sold{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(40,25,32,.62);color:#fff;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:32px;letter-spacing:4px}
.sold small{font:12px "Lato",sans-serif;letter-spacing:3px;opacity:.85}
#modal{position:fixed;inset:0;background:rgba(30,18,25,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .card{max-width:540px;width:100%;max-height:88vh;overflow:auto;animation:rise .25s}
#modal h3{margin:0 0 8px;font-size:26px}
.pay{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}.pay:hover{background:var(--pb)}
.pay input{width:auto;margin:0 8px 0 0}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width 1s linear}
.big{font-size:56px;text-align:center;color:var(--ac)}
.stars{display:flex;gap:6px;justify-content:center;font-size:36px}
.stars span{cursor:pointer;color:#d8ccd0;transition:transform .15s}.stars span.on{color:#e0a43a}.stars span:hover{transform:scale(1.15)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu)}
td,th{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;vertical-align:top}
.ci{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.pbtn,.cbtn{position:fixed;z-index:8;border:0;border-radius:50%;cursor:pointer;color:var(--btx);background:var(--ac);box-shadow:0 4px 14px rgba(120,60,80,.3);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .2s,background .2s}
.pbtn:hover,.cbtn:hover{transform:scale(1.07);background:var(--ac2)}
.pbtn{top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;width:44px;height:44px}
.cbtn{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);right:20px;width:58px;height:58px}
.cbtn b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:#fff;color:var(--ac);border:1px solid var(--ac);font:700 13px/1 "Lato",sans-serif;display:flex;align-items:center;justify-content:center;padding:0 5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat small{color:var(--mu);text-transform:uppercase;letter-spacing:1px;font-size:12px}
.stat b{display:block;font-size:30px;margin-top:2px}
.foot{text-align:center;padding-bottom:100px;color:var(--mu)}
.ft{margin-top:14px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.ft p{margin:0 0 8px;font-weight:700;color:var(--tx)}
.ct{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;color:var(--mu);font-size:15px}
.ct a,.ct span{display:inline-flex;align-items:center;gap:6px;color:var(--ac);text-decoration:none}
.ct a:hover{text-decoration:underline}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-24px;background:linear-gradient(135deg,#f7cdd8,#eaa0b6);border-radius:100% 0 100% 0;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(45px,55vh) rotate(180deg)}100%{transform:translate(-25px,110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#fx{display:none}*{animation:none!important;transition:none!important}}
